name: Atualizar cotações (quotes.json)

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada ~30 min (o GitHub pode atrasar um pouco)
  workflow_dispatch:           # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atualizar quotes.json
        run: node update-quotes.mjs

      - name: Commit e push (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --staged --quiet || (git commit -m "chore: atualiza quotes.json" && git push)
