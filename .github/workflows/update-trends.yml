name: Atualizar Tendências (trends.json)

on:
  schedule:
    - cron: '50 9 * * *'   # todo dia ~06:50 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atualizar trends.json
        run: node update-trends.mjs

      - name: Commit e push (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json
          git diff --staged --quiet || (git commit -m "chore: atualiza trends.json" && git push)
