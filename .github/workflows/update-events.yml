name: Manter agenda de eventos (events.json)

on:
  schedule:
    - cron: '40 9 * * 1'   # toda segunda-feira ~06:40 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atualizar events.json
        run: node update-events.mjs

      - name: Commit e push (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || (git commit -m "chore: atualiza events.json" && git push)
